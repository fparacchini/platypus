<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2a3a"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6abf3a"/>
      <stop offset="100%" stop-color="#4a9f2a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#3a8f4a"/>
      <stop offset="100%" stop-color="#6abf3a"/>
    </linearGradient>
  </defs>
  <!-- Rounded rect background -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- H left stem - navy -->
  <rect x="106" y="80" width="100" height="352" rx="24" fill="url(#left)"/>
  <!-- H right stem - green -->
  <rect x="306" y="80" width="100" height="352" rx="24" fill="url(#right)"/>
  <!-- H crossbar - gradient -->
  <rect x="106" y="216" width="296" height="80" rx="20" fill="url(#bar)"/>
</svg>
